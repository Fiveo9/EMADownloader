[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ema-downloader"
version = "0.1.1"
description = "EMA Regulatory Document Downloader & Organizer - Automated synchronization, indexing, and categorization for EMA regulatory documents and scientific guidelines."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Fiveonine", email = "57358895+Fiveo9@users.noreply.github.com" }
]
keywords = [
    "ema",
    "regulatory",
    "guidelines",
    "pharmaceutical",
    "document-downloader",
    "european-medicines-agency"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Utilities"
]
dependencies = [
    "httpx>=0.25.0",
    "openpyxl>=3.1.0",
    "pandas>=2.0.0",
    "tqdm>=4.65.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov",
    # Web UI 是核心功能,测试覆盖它,因此 flask 属于开发必装依赖。
    "flask>=3.0.0",
]
# SOCKS5 proxy support: pip install -e ".[socks]"
socks = [
    "httpx[socks]>=0.25.0",
]
# Local web UI: pip install -e ".[ui]"
ui = [
    "flask>=3.0.0",
]

[project.scripts]
ema-downloader = "ema_downloader.cli:main"
ema-downloader-ui = "ema_downloader.webapp:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ema_downloader*"]

[tool.setuptools.package-data]
"ema_downloader.webapp" = ["templates/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v"

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# Pin to the classic default rule set so CI is stable across ruff versions.
select = ["E4", "E7", "E9", "F"]
