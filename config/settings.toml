# EMA Downloader Configuration
#
# This file is committed and acts as the shared default template.
# Private values (e.g. proxy pool credentials) belong in
# config/settings.local.toml — it is gitignored and overrides this file
# section by section at startup.

[sources]
# EMA official remote JSON endpoints (updated twice daily)
documents_url = "https://www.ema.europa.eu/en/documents/report/documents-output-json-report_en.json"
general_url = "https://www.ema.europa.eu/en/documents/report/general-json-report_en.json"

[storage]
# Root library folder for downloaded files, database, and generated indexes
library_dir = "EMA_Regulatory_Library"
index_dir = "00_Index"
raw_json_dir = "90_Raw_JSON"
failed_downloads_dir = "99_Failed_Downloads"
database_name = "ema_documents.sqlite3"
excel_name = "EMA_Document_Index.xlsx"
csv_name = "EMA_Document_Index.csv"

[network]
timeout = 45.0
max_retries = 3
retry_delay = 2.0
workers = 5                       # Concurrency workers for document downloads

# Proxy setting:
# 1. Leave empty ("") to auto-detect from environment (HTTP_PROXY / HTTPS_PROXY / ALL_PROXY)
#    or local Clash/V2Ray ports (127.0.0.1:7890).
# 2. Or specify a custom proxy: "http://127.0.0.1:7890" or "socks5://127.0.0.1:1080"
#    (SOCKS5 requires the extra: pip install -e ".[socks]").
# 3. A proxy pool with credentials belongs in config/settings.local.toml (gitignored):
#    proxy = "http://username:password@proxy-host:port"
proxy = ""

# Chunk size for streaming file download (1 MB)
chunk_size = 1048576

# Delay in seconds after each successful download to avoid HTTP 429 rate limiting.
# Recommended: 0.5s with a proxy pool; 1.5s - 2.0s for direct connections.
request_delay = 0.5

[filters]
# Default document types to synchronize
default_types = [
    "scientific-guideline",
    "regulatory-procedural-guideline"
]
# Document status filter (e.g. ["Adopted"], empty list means all)
default_status = []
# Languages to download (first version focuses on English)
default_languages = ["en"]

[classification]
# Path to classification rules CSV
rules_file = "config/classification_rules.csv"
