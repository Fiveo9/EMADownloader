name: Release (Windows exe)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要构建并发布的已有标签（如 v0.1.1），将检出该标签代码后构建"
        required: true
        default: "v0.1.1"

# Tag pushes use github.ref_name; manual runs use the tag input.
env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  build-exe:
    name: Build standalone exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and PyInstaller
        run: pip install -e ".[ui]" pyinstaller

      - name: Build exe
        run: pyinstaller --noconfirm --clean ema_downloader.spec

      - name: Ship editable config files next to the exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist/EMA文件库/config" | Out-Null
          Copy-Item "config/settings.toml" "dist/EMA文件库/config/"
          Copy-Item "config/classification_rules.csv" "dist/EMA文件库/config/"

      # GitHub 净化 Release 附件名时会丢弃非 ASCII 字符（"EMA文件库" 会变成
      # "EMA."），所以外层 zip 用 ASCII 项目名；包内 exe 保持中文产品名。
      - name: Zip the distribution
        shell: pwsh
        run: Compress-Archive -Path "dist/EMA文件库" -DestinationPath "EMADownloader-Windows-x64.zip"

      - name: Create GitHub release and upload asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          if (gh release view ${{ env.RELEASE_TAG }} > $null 2>&1) {
            gh release upload ${{ env.RELEASE_TAG }} "EMADownloader-Windows-x64.zip" --clobber
          } else {
            gh release create ${{ env.RELEASE_TAG }} "EMADownloader-Windows-x64.zip" --title "${{ env.RELEASE_TAG }}" --generate-notes
          }
